name: StableSMP
version: 1.0
main: com.enderdevelopment.stablesmp.StableSMP
author: EnderDevelopment
commands:
  spawn:
    description: Teleport to spawn
    usage: /spawn
  setspawn:
    description: Set the spawn location
    usage: /setspawn
  reload:
    description: Reload the configuration
    usage: /reload
permissions:
  stablesmp.admin:
    description: Allows admin commands
    default: op